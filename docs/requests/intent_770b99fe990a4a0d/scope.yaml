request_id: intent_770b99fe990a4a0d
title: so-vits-svc 4.1-Stable 自动化训练与推理桌面端
version: 0.1.0
updated_at: "2026-11-16"
status: intake-complete

product:
  name: SVC Studio（暂定）
  form: Windows 桌面应用（本地运行、全离线）
  one_liner: 把 so-vits-svc 的命令行流水线收敛成「导入数据 → 一键预处理 → 训练监控 → 试听导出」的受门禁桌面产线
  upstream:
    repo: https://github.com/svc-develop-team/so-vits-svc
    branch: 4.1-Stable
    license: AGPL-3.0
    integration: vendored 锁定副本 + 产品侧编排层（上游已宣告 Archive）
  capability_nature: SVC（歌声/语音音色转换），非 TTS

users:
  - id: U1
    name: 个人创作者
    profile: 有 30 分钟以上干净人声，本机一块 6–12GB 显存显卡，不懂 Python 环境
    jobs: 训练自己的音色模型；把一首歌换成自己的音色；试听满意后导出
  - id: U2
    name: 小型工作室
    profile: 多项目并行、批量交付、需要参数复用与可追溯
    jobs: 批量推理、参数预设、失败重跑、产物与参数留档

platform:
  os:
    - Windows 10 22H2
    - Windows 11 x64
  arch: x64
  runtime: 内置 CPython 3.8.9 + 锁定 wheel（用户无需安装 Python）
  gpu_floor: NVIDIA GTX 1660 6GB
  gpu_recommended: RTX 3060 12GB
  cpu_mode: 仅推理兜底；训练硬性不可用（上游 train.py 断言）
  disk_reserve_gb: 20
  network_default: offline
  telemetry: none

scope:
  in:
    - 环境自检 doctor（Python/torch/CUDA/GPU/ffmpeg/磁盘/编码器/F0/声码器）与一键修复指引
    - 资产中心：清单、sha256、断点续传、镜像切换、离线目录导入、损坏修复
    - 数据集导入、结构校验、QC 报告（时长/分布/采样率/声道/静音/削波/响度）
    - 自动切片（5–15s，可调最小间隔）、44100Hz 单声道重采样、响度处理、可选降噪
    - 预处理编排（resample → preprocess_flist_config → preprocess_hubert_f0）与产物一致性校验
    - config.json / diffusion.yaml 的 Schema 校验、可视化编辑、前置断言
    - 训练：显存探测与参数推荐、100 步冒烟、日志流与内嵌曲线、暂停/续训/取消、OOM 自愈
    - 扩散模型训练、聚类训练、特征检索索引（可选能力）
    - 推理：单条/批量、参数预设、A/B 对照、聚类/检索比例、浅扩散、NSF 增强、响度包络、动态声线混合
    - 模型库：登记、外部模型包兼容导入、压缩（含 FP16）、ONNX 导出入口、删除与占用检查
    - 外部模型（非本软件训练）推理：兼容性判定、依赖资产检查、独立批次输出目录、跨项目只读复用、模型包导入导出
    - 任务中心：统一状态机、日志检索与导出、失败原因中文映射、报告导出
    - 打包（PyInstaller onedir + Inno Setup）、SBOM、AGPL 合规材料、回滚方案
  out:
    - TTS 文本合成（上游不具备该能力，模型不通用）
    - 云端训练、多租户、计费
    - 真人声音授权的代办与背书（产品只做告知、确认与留痕）
    - macOS / 移动端首发支持（架构预留，不进本期验收）
    - 实时麦克风变声、直播推流
    - 模型市场 / 公开分享社区
    - 批量导入多个模型（一次只允许导入 1 组：1 权重 + 1 配置）
    - 内置任何第三方模型权重
    - ONNX / RVC / DiffSinger / TTS-VITS 模型的推理（架构不同；仅支持 so-vits-svc 系 .pth）

journeys:
  - { id: J1, name: 干净机首启与环境自检, priority: P0 }
  - { id: J2, name: 断网导入必需资产, priority: P0 }
  - { id: J3, name: 导入数据集并生成 QC 报告, priority: P0 }
  - { id: J4, name: 长音频切片与清洗, priority: P0 }
  - { id: J5, name: 一键预处理并校验产物, priority: P0 }
  - { id: J6, name: 100 步冒烟训练, priority: P0 }
  - { id: J7, name: 长训、监控与强杀续训, priority: P0 }
  - { id: J8, name: 单条推理、A/B 与导出, priority: P0 }
  - { id: J9, name: 批量推理与失败重跑, priority: P1 }
  - { id: J10, name: 模型压缩与登记, priority: P1 }

constraints:
  hard:
    - id: C-01
      rule: 运行时固定 CPython 3.8.9，不允许使用用户机器上的 Python
    - id: C-02
      rule: 不得提供 TTS 能力或文案暗示可做 TTS
    - id: C-03
      rule: 不内置任何第三方模型权重，全部走导入/下载
    - id: C-04
      rule: 训练/预处理/推理必须以工作区为 cwd 运行；安装目录内的程序子树（app/runtime/assets/configs_template）只读，项目根可放在任意用户可写目录
    - id: C-05
      rule: whisper-ppg 切片上限 25s（上游要求 <30s，取保守值），推理强制 clip=25、lg=1
    - id: C-06
      rule: diffusion.yaml.duration 必须小于最短切片；k_step_max 必须小于 timesteps
    - id: C-07
      rule: 歌声素材禁止开启 auto_predict_f0
    - id: C-08
      rule: 训练仅限 CUDA；CPU 机器训练入口置灰并说明
    - id: C-09
      rule: shallow_diffusion 与 enhance 互斥；feature_retrieval 与 cluster 互斥
    - id: C-10
      rule: 默认零联网、零遥测；任何联网动作需用户显式点击
    - id: C-11
      rule: 外部导入模型只读；推理输出必须落独立批次目录，禁止写模型来源目录、项目 results/ 与安装目录程序子树
    - id: C-12
      rule: 导入模型一律"先完整性检查（1 权重 + 1 配置，不通过不复制）、再 staging 复制、边复制边 sha256、复算通过后原子落位、最后识别"，禁止直接引用或移动用户源文件
    - id: C-13
      rule: 上传只有模型或只有配置时，必须立即提示"请上传模型和配置文件"；完整性通过但识别失败时，必须提示"无法识别该模型"；不提供手动配对与强制导入
  quality:
    - 主线程事件循环 P95 < 200ms（训练满载）
    - 取消任务 5s 内进程树退出且显存回落
    - 24h 浸泡内存增长 < 10%
    - 安装包 ≤ 7.0GB、安装后 ≤ 9.0GB、冷启动 ≤ 8s（预算值，S9 实测校准）

decisions_default:
  - id: D-01
    topic: 暂停语义
    default: 暂停 = 优雅停止训练进程；续训 = 从最近 checkpoint 重新启动 train.py
    reason: 上游无暂停能力（C-07/C-08），UI 不得承诺"零损失暂停"
  - id: D-02
    topic: 上游集成方式
    default: vendored 源码副本 + 产品侧编排层；仅在必要时做最小补丁（补丁清单随源码公开）
    reason: 上游将归档；AGPL 允许修改但必须提供对应源码
  - id: D-03
    topic: 训练设备
    default: 默认锁定单卡（CUDA_VISIBLE_DEVICES），多卡需在设置中显式开启
    reason: 上游按卡数 spawn，多卡会把 batch_size 拆散并放大 OOM 概率
  - id: D-04
    topic: 响度处理
    default: 默认开启"峰值保护"（限制到 -1dBFS），上游 0dBFS 归一化仅作为可选
    reason: 上游响度匹配实为峰值归一化，直接 0dBFS 会削波（见 intake 事实 C-11）
  - id: D-05
    topic: 模型默认命名
    default: 项目内 `logs/44k/G_{step}.pth` 保持上游命名；模型库用 `模型名@step` 做显示名
    reason: 上游 checkpoint 发现逻辑依赖文件名
  - id: D-06
    topic: 多说话人
    default: 首发支持导入多 speaker 目录，但 UI 以单说话人为默认路径；多说话人训练标记为"进阶"
    reason: 上游支持 n_speakers，但目标用户以单音色为主
  - id: D-11
    topic: 模型导入方式
    default: 上传区拖拽即复制进受管目录（`models/imports/<slug>/model/`）；先做"1 权重 + 1 配置"完整性检查（不通过弹窗且不复制），再 staging 复制 → sha256 复算 → 原子落位 → 识别；不做"仅引用"、不做手动配对
    reason: 用户明确要求"拖进上传区域直接复制到软件能识别到的位置"；复制保证路径稳定、可 sha256 校验、源目录只读也能导入
    decided_at: "2026-11-16"
    decided_by: 用户
  - id: D-07
    topic: 项目根位置
    default: 任意用户可写目录；程序子树（app/runtime/assets/configs_template）只读禁写；便携模式数据随应用走
    reason: 只有"程序目录会被升级覆盖/卸载清理"是真实约束，其余目录不该限制
  - id: D-08
    topic: 模型与推理的作用域
    default: 模型是全局资产（带来源项目标签），可跨项目只读引用；推理按批次归档到 results/<批次>/；无项目时可开独立推理工作区
    reason: 一个音色会被反复用于多条音频与多个项目，推理没有理由绑定训练项目
  - id: D-09
    topic: 外部模型接入
    default: 支持 so-vits-svc 系 .pth（含 4.0 / 压缩 / FP16 / 多说话人），默认复制进 imports/ 托管；ONNX/RVC/TTS 明确不支持
    reason: 推理只依赖 state_dict 形状与 config 字段，与训练来源无关；复制换取路径稳定与可校验
  - id: D-10
    topic: 外部模型输出
    default: imports/<模型>/outputs/<时间_批次>/ 独立目录，含 report.json 与 params.json；允许另存/移动
    reason: 与项目产物彻底隔离，避免"这批音频属于哪个项目"的歧义

deliverables:
  - 详细 PRD（PRD.md + prd/ 附录三册）
  - spec/spec.md 与 plan/plan.md（后续阶段）
  - Windows 安装包与校验和
  - SBOM、第三方许可证清单、AGPL 对应源码
  - 验收报告 verification.md 与 review.md

open_questions:
  - id: Q-01
    question: 是否接受「暂停 = 停止、续训 = 重启」的诚实语义？
    default: 接受
  - id: Q-02
    question: 是否允许应用内提供官方资产下载（GitHub/HF 链接直连），还是只做离线导入？
    default: 两者都做，下载默认关闭、需点击
  - id: Q-03
    question: ONNX 导出是否进首发？
    default: 进首发，但标注"实验性"（上游需手改脚本路径）
  - id: Q-04
    question: 首发是否包含动态声线混合时间轴编辑器？
    default: 包含基础版（轨道表 + 试听），不做可视化拖拽曲线
  - id: Q-05
    question: 安装包是否内置 ffmpeg？
    default: 内置（避免用户环境差异）
  # Q-06（外部模型复制 vs 引用）已于 2026-11-16 由用户定稿为 D-11：拖拽上传后复制托管
