name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag, e.g. v0.1.14"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  prepare:
    name: prepare draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write release notes with per-platform download links
        run: |
          set -e
          V="${TAG#v}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          cat > notes.md <<EOF
          ## SVC Studio ${V}

          ### 下载（按平台选择）

          | 平台 | 安装包 | 说明 |
          | --- | --- | --- |
          | **Windows 10/11 x64** | [下载 Windows 安装包（.exe）](${BASE}/SVC.Studio_${V}_x64-setup.exe) | NSIS 安装器，内置 ffmpeg |
          | **macOS Intel + Apple Silicon** | [下载 macOS 安装包（.dmg）](${BASE}/SVC.Studio_${V}_universal.dmg) | Universal 二进制，一个包通用 |

          点表格里的链接即可直接下载对应平台的安装包。

          ### 首次启动

          安装包**不含 Python 运行时**（约 3.6GB，37 个分卷）。首次启动会出现「先安装内置运行时」向导：

          1. 点 **自动下载运行时**（断点续传 + 逐卷 sha256 校验 + 自动解压）；
          2. 或点 **选择本地 zip**，指定已下载的运行时压缩包。

          ### 已知限制

          - 训练仅 Windows + NVIDIA GPU（≥6GB 显存）；macOS 仅预处理与 CPU 推理
          - macOS 包未签名、未公证，首次打开请右键 →「打开」
          - 升级/卸载会删除安装目录内的 \`projects/\`，请先自行备份
          - 音质取决于素材量：30 秒只够验证链路，可用音色建议 30 分钟以上干声

          许可证：AGPL-3.0（含 so-vits-svc 4.1-Stable 源码）
          EOF
          echo "--- notes preview ---"
          cat notes.md
      - name: Create or update draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          V="${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "SVC Studio ${V}" --notes-file notes.md
          else
            gh release create "$TAG" --title "SVC Studio ${V}" --notes-file notes.md --draft
          fi

  windows:
    name: build windows installer
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Stage resources
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/stage-runtime.ps1
      - name: Fetch separator model
        shell: pwsh
        continue-on-error: true
        run: |
          $dir = "src-tauri/resources/separator"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $out = Join-Path $dir "MDX23C-8KFFT-InstVoc_HQ.ckpt"
          $url = "https://github.com/${{ github.repository }}/releases/download/assets-separator/MDX23C-8KFFT-InstVoc_HQ.ckpt"
          for ($i = 1; $i -le 6; $i++) {
            curl.exe -L --retry 5 --retry-all-errors --connect-timeout 20 -o $out $url
            if ((Test-Path $out) -and ((Get-Item $out).Length -gt 400MB)) { Write-Host "separator model ok"; exit 0 }
            Write-Host "separator retry $i"; Start-Sleep -Seconds (10 * $i)
          }
          Write-Host "::warning::separator 模型下载失败，安装包将不含 MDX23C（推理回退 Demucs）"
          Set-Content -Path (Join-Path $dir "README.txt") -Value "MDX23C not bundled" -Encoding ASCII

      - name: Fetch roformer model
        shell: pwsh
        continue-on-error: true
        run: |
          $dir = "src-tauri/resources/separator"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $out = Join-Path $dir "model_bs_roformer_ep_368_sdr_12.9628.ckpt"
          $url = "https://hf-mirror.com/Politrees/UVR_resources/resolve/main/models/Roformer/BandSplit/model_bs_roformer_ep_368_sdr_12.9628.ckpt"
          for ($i = 1; $i -le 6; $i++) {
            curl.exe -L --retry 5 --retry-all-errors --connect-timeout 30 -o $out $url
            if ((Test-Path $out) -and ((Get-Item $out).Length -gt 600MB)) { Write-Host "roformer model ok"; exit 0 }
            Write-Host "roformer retry $i"; Start-Sleep -Seconds (10 * $i)
          }
          Write-Host "::warning::RoFormer 权重下载失败，分离将回退 MDX23C/Demucs"
          Remove-Item $out -Force -ErrorAction SilentlyContinue

      - name: Fetch dnsmos models
        shell: pwsh
        continue-on-error: true
        run: |
          $dir = "src-tauri/resources/pretrain/dnsmos"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $base = "https://raw.githubusercontent.com/microsoft/DNS-Challenge/master/DNSMOS/DNSMOS"
          foreach ($f in @("sig_bak_ovr.onnx", "model_v8.onnx")) {
            $out = Join-Path $dir $f
            for ($i = 1; $i -le 5; $i++) {
              curl.exe -L --fail --retry 3 --connect-timeout 20 -o $out "$base/$f"
              if ((Test-Path $out) -and ((Get-Item $out).Length -gt 100KB)) { Write-Host "$f ok"; break }
              Write-Host "$f retry $i"; Start-Sleep -Seconds (5 * $i)
            }
          }
          if (-not (Test-Path (Join-Path $dir "sig_bak_ovr.onnx"))) {
            Write-Host "::warning::DNSMOS 模型下载失败，感知评分不可用（其余功能不受影响）"
          }

      - name: Build installer (signed)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build
      - name: Upload installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $files = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe*
          Write-Host "uploading $($files.Count) windows assets"
          foreach ($f in $files) { gh release upload $env:TAG $f.FullName --clobber }

  macos:
    name: build macos dmg
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: pnpm install --frozen-lockfile
      - name: Stage resources
        run: |
          mkdir -p src-tauri/resources/upstream src-tauri/resources/assets src-tauri/resources/bin
          cp -R vendor/so-vits-svc/. src-tauri/resources/upstream/
          rm -rf src-tauri/resources/upstream/.git
          cp assets/manifest.json src-tauri/resources/assets/
          echo "ffmpeg provided by system" > src-tauri/resources/bin/README.txt
          mkdir -p src-tauri/resources/pretrain/nsf_hifigan
          curl -L --fail --retry 3 -o src-tauri/resources/pretrain/checkpoint_best_legacy_500.pt https://hf-mirror.com/lj1995/VoiceConversionWebUI/resolve/main/hubert_base.pt
          curl -L --fail --retry 3 -o src-tauri/resources/pretrain/rmvpe.pt https://hf-mirror.com/datasets/ylzz1997/rmvpe_pretrain_model/resolve/main/rmvpe.pt
          curl -L --fail --retry 3 -o src-tauri/resources/pretrain/nsf_hifigan/model https://hf-mirror.com/choihkk/nsf-hifigan/resolve/main/model
          curl -L --fail --retry 3 -o src-tauri/resources/pretrain/nsf_hifigan/config.json https://hf-mirror.com/choihkk/nsf-hifigan/resolve/main/config.json
      - name: Fetch separator model
        continue-on-error: true
        run: |
          mkdir -p src-tauri/resources/separator
          out=src-tauri/resources/separator/MDX23C-8KFFT-InstVoc_HQ.ckpt
          url="https://github.com/${{ github.repository }}/releases/download/assets-separator/MDX23C-8KFFT-InstVoc_HQ.ckpt"
          for i in 1 2 3 4 5 6; do
            curl -L --fail --retry 5 --retry-all-errors --connect-timeout 20 -o "$out" "$url" || true
            if [ -f "$out" ] && [ "$(wc -c < "$out")" -gt 400000000 ]; then echo "separator model ok"; exit 0; fi
            echo "separator retry $i"; sleep $((10 * i))
          done
          echo "::warning::separator 模型下载失败，dmg 将不含 MDX23C"
          echo "not bundled" > src-tauri/resources/separator/README.txt

      - name: Fetch roformer model
        continue-on-error: true
        run: |
          mkdir -p src-tauri/resources/separator
          out=src-tauri/resources/separator/model_bs_roformer_ep_368_sdr_12.9628.ckpt
          url="https://hf-mirror.com/Politrees/UVR_resources/resolve/main/models/Roformer/BandSplit/model_bs_roformer_ep_368_sdr_12.9628.ckpt"
          for i in 1 2 3 4 5 6; do
            curl -L --fail --retry 5 --retry-all-errors --connect-timeout 30 -o "$out" "$url" || true
            if [ -f "$out" ] && [ "$(wc -c < "$out")" -gt 600000000 ]; then echo "roformer model ok"; exit 0; fi
            echo "roformer retry $i"; sleep $((10 * i))
          done
          echo "::warning::RoFormer 权重下载失败，分离将回退 MDX23C/Demucs"
          rm -f "$out"

      - name: Fetch dnsmos models
        continue-on-error: true
        run: |
          mkdir -p src-tauri/resources/pretrain/dnsmos
          base="https://raw.githubusercontent.com/microsoft/DNS-Challenge/master/DNSMOS/DNSMOS"
          for f in sig_bak_ovr.onnx model_v8.onnx; do
            out="src-tauri/resources/pretrain/dnsmos/$f"
            for i in 1 2 3; do
              curl -L --fail --retry 3 --connect-timeout 20 -o "$out" "$base/$f" || true
              if [ -f "$out" ] && [ "$(wc -c < "$out")" -gt 100000 ]; then echo "$f ok"; break; fi
              echo "$f retry $i"; sleep $((5 * i))
            done
          done

      - name: Build dmg (retry once)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -e
          pnpm tauri build --target universal-apple-darwin --config '{"bundle":{"targets":["dmg"],"active":true}}' && exit 0
          echo "retrying after cleaning mounts"
          hdiutil info | awk '/^\/dev\/disk/ {print $1}' | while read d; do diskutil unmountDisk force "$d" 2>/dev/null || true; done
          sleep 15
          pnpm tauri build --target universal-apple-darwin --config '{"bundle":{"targets":["dmg"],"active":true}}'
      - name: Upload dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg --clobber

  runtime:
    name: build python runtime
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      SVCSTUDIO_FAIRSEQ_WHEEL_URL: https://github.com/wisdomWindy/svc-studio/releases/download/runtime-deps/fairseq_fixed-0.12.3.1-cp313-cp313-win_amd64.whl
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/build-runtime.ps1
      - name: Pack assets
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart("v")
          pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/make-runtime-assets.ps1 -Version $version -OutDir runtime-assets -PartMB 100
          Remove-Item runtime-assets/*.zip -Force
      - name: Upload runtime assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $files = Get-ChildItem runtime-assets/* | Where-Object { $_.Name -notlike "*.zip" }
          Write-Host "uploading $($files.Count) assets"
          foreach ($f in $files) {
            gh release upload $env:TAG $f.FullName --clobber
            if ($LASTEXITCODE -ne 0) { throw "upload failed: $($f.Name)" }
          }

  latest:
    name: publish latest.json
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download "$TAG" --dir assets --clobber || true
          ls -l assets | head -50
      - name: Build latest.json
        env:
          TAG: ${{ env.TAG }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, datetime
          tag = os.environ["TAG"]
          version = tag.lstrip("v")
          assets = pathlib.Path("assets")
          platforms = {}
          def sig_for(name):
              p = assets / (name + ".sig")
              return p.read_text().strip() if p.exists() else ""
          exe = next((p.name for p in assets.glob("*.exe")), None)
          if exe:
              platforms["windows-x86_64"] = {
                  "signature": sig_for(exe),
                  "url": f"https://github.com/{os.environ['GH_REPO']}/releases/download/{tag}/{exe}",
              }
          data = {
              "version": version,
              "notes": f"SVC Studio {version}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00", "Z"),
              "platforms": platforms,
          }
          pathlib.Path("latest.json").write_text(json.dumps(data, ensure_ascii=False, indent=2))
          print(json.dumps(data, ensure_ascii=False)[:400])
          PY
      - name: Upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" latest.json --clobber

  publish:
    name: publish release
    needs: [windows, macos, runtime, latest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Flip draft to published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$TAG" --draft=false --prerelease=false
