name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag, e.g. v0.1.13"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  prepare:
    name: prepare draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create draft if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "SVC Studio ${TAG#v}" --notes "auto release" --draft

  windows:
    name: build windows installer
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Stage resources
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/stage-runtime.ps1
      - run: pnpm tauri build
      - name: Upload installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload $env:TAG (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe).FullName --clobber

  macos:
    name: build macos dmg
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: pnpm install --frozen-lockfile
      - name: Stage resources
        run: |
          mkdir -p src-tauri/resources/upstream src-tauri/resources/assets src-tauri/resources/bin
          cp -R vendor/so-vits-svc/. src-tauri/resources/upstream/
          rm -rf src-tauri/resources/upstream/.git
          cp assets/manifest.json src-tauri/resources/assets/
          echo "ffmpeg provided by system" > src-tauri/resources/bin/README.txt
      - name: Build dmg (retry once)
        run: |
          set -e
          pnpm tauri build --target universal-apple-darwin --config '{"bundle":{"targets":["dmg"],"active":true}}' && exit 0
          echo "retrying after cleaning mounts"
          hdiutil info | awk '/^\/dev\/disk/ {print $1}' | while read d; do diskutil unmountDisk force "$d" 2>/dev/null || true; done
          sleep 15
          pnpm tauri build --target universal-apple-darwin --config '{"bundle":{"targets":["dmg"],"active":true}}'
      - name: Upload dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg --clobber

  runtime:
    name: build python runtime
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      SVCSTUDIO_FAIRSEQ_WHEEL_URL: https://github.com/wisdomWindy/svc-studio/releases/download/runtime-deps/fairseq_fixed-0.12.3.1-cp313-cp313-win_amd64.whl
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/build-runtime.ps1
      - name: Pack assets
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart("v")
          pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/make-runtime-assets.ps1 -Version $version -OutDir runtime-assets -PartMB 100
          Remove-Item runtime-assets/*.zip -Force
      - name: Upload runtime assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $files = Get-ChildItem runtime-assets/* | Where-Object { $_.Name -notlike "*.zip" }
          Write-Host "uploading $($files.Count) assets"
          foreach ($f in $files) {
            gh release upload $env:TAG $f.FullName --clobber
            if ($LASTEXITCODE -ne 0) { throw "upload failed: $($f.Name)" }
          }

  publish:
    name: publish release
    needs: [windows, macos, runtime]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Flip draft to published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$TAG" --draft=false --prerelease=false
