name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "发布到哪个 tag（例：v0.1.1）"
        required: true

permissions:
  contents: write

jobs:
  windows:
    name: build (windows-x64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Stage resources
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/stage-runtime.ps1
      - run: pnpm tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  macos:
    name: build (macos-universal)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: pnpm install --frozen-lockfile
      - name: Stage resources
        run: |
          mkdir -p src-tauri/resources/upstream src-tauri/resources/assets src-tauri/resources/bin
          cp -R vendor/so-vits-svc/. src-tauri/resources/upstream/
          rm -rf src-tauri/resources/upstream/.git
          cp assets/manifest.json src-tauri/resources/assets/
          echo "ffmpeg 由系统提供" > src-tauri/resources/bin/README.txt
      - run: pnpm tauri build --target universal-apple-darwin --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: SVC Studio ${{ github.event.inputs.tag || github.ref_name }}
          prerelease: true
          fail_on_unmatched_files: false
          files: dist/**/*
