name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "发布到哪个 tag（例：v0.1.3）"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  prepare:
    name: prepare draft release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - id: tag
        run: echo "value=${{ env.TAG }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - name: Create draft if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ env.TAG }}" >/dev/null 2>&1 || \
            gh release create "${{ env.TAG }}" \
              --title "SVC Studio ${{ env.TAG }}" \
              --notes "自动发布：安装包 + 运行时包（每次发版重新构建运行时）。" \
              --draft

  windows:
    name: build windows installer
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Stage resources
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/stage-runtime.ps1
      - run: pnpm tauri build
      - name: Upload installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload $env:TAG (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe).FullName --clobber

  macos:
    name: build macos dmg
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: pnpm install --frozen-lockfile
      - name: Stage resources
        run: |
          mkdir -p src-tauri/resources/upstream src-tauri/resources/assets src-tauri/resources/bin
          cp -R vendor/so-vits-svc/. src-tauri/resources/upstream/
          rm -rf src-tauri/resources/upstream/.git
          cp assets/manifest.json src-tauri/resources/assets/
          echo "ffmpeg 由系统提供" > src-tauri/resources/bin/README.txt
      - run: pnpm tauri build --target universal-apple-darwin --config '{"bundle":{"targets":["dmg"],"active":true}}'
      - name: Upload dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg --clobber


  publish:
    name: publish release
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Flip draft to published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$TAG" --draft=false --prerelease=false
